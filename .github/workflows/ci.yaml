name: SecureCloud CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Run API tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: apps/demo-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/demo-api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  network-cidr-test:
    name: Validate network CIDR ranges
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate network CIDR ranges
        run: python infrastructure/terraform/tests/validate_network_cidrs.py

  secret-scan:
    name: Scan repository for secrets
    runs-on: ubuntu-24.04

    steps:
      - name: Check out full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit-scan:
    name: Scan Python code with Bandit
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run Bandit security scan
        run: bandit -r apps/demo-api/app -ll

  trivy-scan:
    name: Scan Docker image with Trivy
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t securecloud-demo-api:${{ github.sha }} \
            apps/demo-api

      - name: Inspect Python packages in image
        run: |
          docker run --rm --entrypoint python securecloud-demo-api:${{ github.sha }} \
            -c "import importlib.metadata as m; print('\n'.join(sorted(d.metadata['Name'] + '==' + d.version for d in m.distributions())))"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: securecloud-demo-api:${{ github.sha }}
          scan-type: image
          format: json
          output: trivy-report.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 7

  terraform-validation:
    name: Validate Terraform configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform -chdir=infrastructure/terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=infrastructure/terraform validate

  iac-security-scan:
    name: Scan Terraform configuration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Scan infrastructure configuration
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
