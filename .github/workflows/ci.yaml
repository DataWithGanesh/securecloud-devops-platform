name: SecureCloud CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Run API tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: apps/demo-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/demo-api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  network-cidr-test:
    name: Validate network CIDR ranges
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate network CIDR ranges
        run: python infrastructure/terraform/tests/validate_network_cidrs.py

  network-security-tests:
    name: Test Terraform network security controls
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run network security regression tests
        run: >-
          python -m unittest discover
          -s infrastructure/terraform/tests
          -p "test_*.py"
          -v

  secret-scan:
    name: Scan repository for secrets
    runs-on: ubuntu-24.04

    steps:
      - name: Check out full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit-scan:
    name: Scan Python code with Bandit
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run Bandit security scan
        run: bandit -r apps/demo-api/app -ll

  trivy-scan:
    name: Scan Docker image with Trivy
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t securecloud-demo-api:${{ github.sha }} \
            apps/demo-api

      - name: Inspect Python packages in image
        run: |
          docker run --rm --entrypoint python securecloud-demo-api:${{ github.sha }} \
            -c "import importlib.metadata as m; print('\n'.join(sorted(d.metadata['Name'] + '==' + d.version for d in m.distributions())))"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: securecloud-demo-api:${{ github.sha }}
          scan-type: image
          format: json
          output: trivy-report.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 7

  terraform-validation:
    name: Validate Terraform configuration
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform -chdir=infrastructure/terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=infrastructure/terraform validate

  iac-security-scan:
    name: Scan Terraform configuration
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Scan infrastructure configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  kubernetes-manifest-tests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3

      - name: Run Kubernetes manifest tests
        run: >-
          python -m unittest discover
          -s deployment/kubernetes/tests
          -p "test_*.py"
          -v

      - name: Install Kubeconform
        shell: bash
        run: |
          curl -fsSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate Kubernetes manifest schemas
        run: >-
          kubeconform
          -strict
          -summary
          deployment/kubernetes/demo-api/

  helm-validation:
    name: Validate Helm chart
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v4.3.1"

      - name: Lint Helm chart
        run: helm lint deployment/helm/securecloud-demo-api

      - name: Render Helm chart
        run: |
          helm template securecloud-demo-api \
            deployment/helm/securecloud-demo-api \
            --namespace securecloud \
            --output-dir /tmp/securecloud-rendered

      - name: Install Kubeconform
        shell: bash
        run: |
          curl -fsSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate rendered Helm resources
        shell: bash
        run: |
          mapfile -d '' -t manifests < <(
            find /tmp/securecloud-rendered -type f -name '*.yaml' -print0
          )

          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "ERROR: No rendered Helm YAML manifests found."
            exit 1
          fi

          printf 'Validating %s rendered manifests\n' "${#manifests[@]}"
          kubeconform -strict -summary "${manifests[@]}"

  argocd-validation:
    name: Validate Argo CD GitOps configuration
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3

      - name: Validate Argo CD Application manifest
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          path = Path("deployment/argocd/application.yaml")
          app = yaml.safe_load(path.read_text(encoding="utf-8"))

          assert app["apiVersion"] == "argoproj.io/v1alpha1"
          assert app["kind"] == "Application"
          assert app["metadata"]["name"] == "securecloud-demo-api"
          assert app["metadata"]["namespace"] == "argocd"
          assert app["spec"]["source"]["repoURL"] == "https://github.com/DataWithGanesh/securecloud-devops-platform.git"
          assert app["spec"]["source"]["targetRevision"] == "main"
          assert app["spec"]["source"]["path"] == "deployment/helm/securecloud-demo-api"
          assert app["spec"]["destination"]["namespace"] == "securecloud"
          assert app["spec"]["syncPolicy"]["automated"]["selfHeal"] is True
          assert app["spec"]["syncPolicy"]["automated"]["prune"] is False

          print("Argo CD Application YAML and required settings are valid.")
          PY
