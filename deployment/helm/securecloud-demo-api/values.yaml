replicaCount: 2
nameOverride: ''
fullnameOverride: ''
image:
  repository: ghcr.io/datawithganesh/securecloud-demo-api
  tag: ''
  digest: sha256:b7b01d6033019c23e389ba60ed919290819039015612e65823fac9bc335e4291
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  name: ''
  automount: false
  annotations: {}
podAnnotations: {}
podLabels:
  app.kubernetes.io/part-of: securecloud
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
containerPort: 8000
service:
  type: ClusterIP
  port: 8000
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: false
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
