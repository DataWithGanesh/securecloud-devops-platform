apiVersion: apps/v1
kind: Deployment
metadata:
  name: securecloud-demo-api
  namespace: securecloud
  labels:
    app.kubernetes.io/name: securecloud-demo-api
    app.kubernetes.io/part-of: securecloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: securecloud-demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: securecloud-demo-api
        app.kubernetes.io/part-of: securecloud
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-api
          image: securecloud-demo-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
